# .github/workflows/deploy.yml
# Despliega la aplicación HTML estática en Netlify: producción en push a main,
# preview en pull requests.
# Requiere los secretos NETLIFY_AUTH_TOKEN y NETLIFY_SITE_ID en
# Settings → Secrets and variables → Actions del repositorio.

name: Deploy a Netlify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_target:
        description: "Destino del despliegue manual"
        required: true
        default: preview
        type: choice
        options:
          - preview
          - production

permissions:
  contents: read

concurrency:
  group: netlify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Validar estructura y JavaScript
        shell: bash
        run: |
          set -euo pipefail
          test -s "Cronómetro · Migración Storage Pure Cirion VE.html"
          test -d docs/images
          test -f docs/images/login-current.png
          script="$(mktemp)"
          sed -n '/<script>/,/<\/script>/p' "Cronómetro · Migración Storage Pure Cirion VE.html" \
            | sed '1d;$d' > "$script"
          node --check "$script"
          rm -f "$script"

      - name: Preparar sitio estático
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist/docs/images
          cp "Cronómetro · Migración Storage Pure Cirion VE.html" dist/index.html
          cp docs/images/* dist/docs/images/
          test -s dist/index.html
          test -f dist/docs/images/login-current.png

      - name: Publicar artefacto del sitio
        uses: actions/upload-artifact@v4
        with:
          name: netlify-site-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
      PUBLISH_DIR: dist
      NETLIFY_CLI_VERSION: 17.10.1

    steps:
      - name: Validar configuración
        shell: bash
        run: |
          set -euo pipefail
          test -n "$NETLIFY_AUTH_TOKEN" || {
            echo "::error::Falta el secret NETLIFY_AUTH_TOKEN"
            exit 1
          }
          test -n "$NETLIFY_SITE_ID" || {
            echo "::error::Falta el secret NETLIFY_SITE_ID"
            exit 1
          }

      - name: Descargar artefacto del sitio
        uses: actions/download-artifact@v4
        with:
          name: netlify-site-${{ github.sha }}
          path: ${{ env.PUBLISH_DIR }}

      - name: Publicar resumen del sitio
        shell: bash
        run: |
          {
            echo "### Deploy a Netlify"
            echo ""
            echo "- Rama: \`${GITHUB_REF_NAME}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Directorio publicado: \`${PUBLISH_DIR}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy a producción
        if: >
          github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' &&
           inputs.deploy_target == 'production')
        run: npx --yes "netlify-cli@$NETLIFY_CLI_VERSION" deploy --dir="$PUBLISH_DIR" --prod --message "Deploy ${{ github.sha }}"

      - name: Deploy preview (PR)
        if: >
          github.event_name == 'pull_request' ||
          (github.event_name == 'workflow_dispatch' &&
           inputs.deploy_target == 'preview')
        env:
          PREVIEW_ALIAS: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || format('manual-{0}', github.run_id) }}
        run: npx --yes "netlify-cli@$NETLIFY_CLI_VERSION" deploy --dir="$PUBLISH_DIR" --alias "$PREVIEW_ALIAS" --message "Preview ${{ github.sha }}"

      - name: Verificar sitio publicado
        if: vars.NETLIFY_SITE_URL != ''
        shell: bash
        env:
          NETLIFY_SITE_URL: ${{ vars.NETLIFY_SITE_URL }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --retry 5 --retry-delay 2 --retry-all-errors \
            "$NETLIFY_SITE_URL" > /dev/null
          echo "- Health-check: OK (\`$NETLIFY_SITE_URL\`)" >> "$GITHUB_STEP_SUMMARY"