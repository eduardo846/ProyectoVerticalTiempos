# .github/workflows/deploy.yml
# Despliega la aplicación HTML estática en Netlify: producción en push a main,
# preview en pull requests.
# Requiere los secretos NETLIFY_AUTH_TOKEN y NETLIFY_SITE_ID en
# Settings → Secrets and variables → Actions del repositorio.

name: Deploy a Netlify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
      PUBLISH_DIR: dist

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar sitio estático
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$PUBLISH_DIR"
          mkdir -p "$PUBLISH_DIR/docs/images"
          cp "Cronómetro · Migración Storage Pure Cirion VE.html" "$PUBLISH_DIR/index.html"
          cp docs/images/* "$PUBLISH_DIR/docs/images/"

      - name: Deploy a producción
        if: github.event_name == 'push'
        run: npx --yes netlify-cli deploy --dir="$PUBLISH_DIR" --prod --message "Deploy ${{ github.sha }}"

      - name: Deploy preview (PR)
        if: github.event_name == 'pull_request'
        run: npx --yes netlify-cli deploy --dir="$PUBLISH_DIR" --alias "pr-${{ github.event.number }}" --message "PR #${{ github.event.number }}"